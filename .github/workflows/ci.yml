name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  qa:
    # Private dependency credentials are unavailable to fork pull requests.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: QA (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up isolated Composer directories
        run: |
          echo "COMPOSER_HOME=$RUNNER_TEMP/sdk-composer-home" >> "$GITHUB_ENV"
          echo "COMPOSER_CACHE_DIR=$RUNNER_TEMP/sdk-composer-cache" >> "$GITHUB_ENV"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring, xml, curl, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer archives
        uses: actions/cache@v4
        with:
          # Cache downloaded archives only, never Composer home or auth files.
          path: ${{ env.COMPOSER_CACHE_DIR }}/files
          key: ${{ runner.os }}-sdk-composer-v2-php-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-sdk-composer-v2-php-${{ matrix.php }}-

      - name: Install dependencies
        env:
          # Configure a read-only token for the private dependency repositories.
          # Both variables exist only for this step; no auth is written globally.
          COMPOSER_AUTH_TOKEN: ${{ secrets.COMPOSER_AUTH_TOKEN }}
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.COMPOSER_AUTH_TOKEN }}"}}'
        run: |
          if [ -z "$COMPOSER_AUTH_TOKEN" ]; then
            echo "::error::COMPOSER_AUTH_TOKEN must provide read access to the private dependency repositories."
            exit 1
          fi
          composer install --no-progress --no-interaction --prefer-dist --no-scripts --no-plugins

      - name: Remove temporary Composer home
        if: always()
        run: rm -rf -- "$COMPOSER_HOME"

      - name: Verify credential boundary
        run: |
          test -z "${COMPOSER_AUTH:-}"
          test -z "${COMPOSER_AUTH_TOKEN:-}"
          test ! -e "$COMPOSER_HOME"

      - name: Run PHPUnit
        run: composer test

      - name: Run PHPCS
        run: composer phpcs
